[project]
name = "waves"
authors = [{ name = "iamprivacy" }]
# Kept equal to waves.waves_ui.__version__, which is the version the app and
# the updater actually report; tests/test_package_version.py fails the build if
# the two drift. Bump both in the same commit that cuts a release.
version = "0.1.26"
description = "Waves: a native desktop app for saving music from your own TIDAL account for offline listening"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[project.urls]
homepage = "https://getwaves.dev"
repository = "https://github.com/iamprivacy/Waves"
documentation = "https://getwaves.dev"

[tool.poetry]
packages = [{ include = "waves" }]

[tool.poetry.dependencies]
requests = "~2.32.5"
mutagen = "^1.47.0"
dataclasses-json = "^0.6.7"
pathvalidate = "^3.3.1"
m3u8 = "^6.0.0"
# Exact pin. PySide6 6.10.0 through 6.11.1 ship macOS binding libraries built
# for macOS 15 despite their macosx_13_0 wheel tag, so on macOS this version
# really requires Sequoia (dyld kills the app on anything older, issue #14).
# The release handles that with two macOS flavors: the regular build uses this
# pin (floor 15.0), and CI's legacy macOS legs overlay pyside6==6.9.3 (the
# newest release whose binaries honor their macOS 12 wheel tag) on top of the
# locked venv for a "_legacy" bundle with floor 12.0 (see WAVES_MACOS_MIN in
# the Makefile and the legacy legs in release-or-test-build.yml). CI's "Assert
# macOS version floor" step enforces each flavor's floor on every macOS build;
# when a PySide6 release honors its wheel tags again the legacy legs can go.
pyside6 = { version = "6.11.1", optional = true }
tidalapi = "^0.8.10"
python-ffmpeg = "^2.0.12"
pycryptodome = "^3.23.0"
certifi = ">=2026.4.22"
urllib3 = "^2.7.0"

[project.optional-dependencies]
gui = ["pyside6"]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
deptry = "^0.24.0"
pre-commit = "^4.5.0"
tox = "^4.32.0"
pyupgrade = "^3.21.2"
pillow = "^12.0.0"
black = "^25.11.0"
nuitka = "2.8.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true
# Overview: https://docs.astral.sh/ruff/rules/
select = [
  # flake8-2020
  "YTT",
  # flake8-bandit
  "S",
  # flake8-bugbear
  "B",
  # flake8-builtins
  "A",
  # flake8-comprehensions
  "C4",
  # flake8-debugger
  "T10",
  # flake8-simplify
  "SIM",
  # isort
  "I",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  "W",
  # pyflakes
  "F",
  # pygrep-hooks
  "PGH",
  # pyupgrade
  "UP",
  # ruff
  "RUF",
  # tryceratops
  "TRY",
]
ignore = [
  # LineTooLong
  "E501",
  # DoNotAssignLambda
  "E731",
  # Do not use bare `except`
  "E722",
  # PEP 484 prohibits implicit `Optional`
  # Disabled only temporarily.
  "RUF013",
  # Ambiguous-unicode warnings: the UI deliberately uses real typography
  # (en dash "–", multiplication sign "×", etc.) in user-facing strings,
  # docstrings and comments.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.per-file-ignores]
# Tests use asserts (S101), terse error messages (TRY003) and throwaway temp
# paths like "/tmp/x" as never-touched dummy dirs (S108).
"tests/*" = ["S101", "TRY003", "S108"]
# The Back-to-Browse scroll guard re-runs itself in a subprocess to isolate the
# Qt boot (S603, fixed argv), and its boot -> drive -> assert scenario is one
# deliberately linear function (C901).
"tests/test_browse_back_scroll.py" = ["S603", "C901"]
# Sets a real xattr via the fixed /usr/bin/xattr binary to exercise the strip
# helper for real on macOS (S603, fixed argv).
"tests/test_apple_double_cleanup.py" = ["S603"]
# Measures import-time metadata cost in a fresh interpreter: this interpreter
# runs a literal probe script (S603, fixed argv).
"tests/test_lazy_metadata.py" = ["S603"]
# The library scanner's directory walk (_walk_album_dirs) is a small state
# machine over each folder's probe result (unchanged / relist / transient error /
# vanished / root offline); the branching is the point and the function was kept
# whole so it reads (and was reviewed) as one flow, so exempt mccabe (C901).
"waves/library_index.py" = ["C901"]
# Same subprocess-isolation + linear-scenario shape as the scroll guard.
"tests/test_forward_history_account_switch.py" = ["S603", "C901"]
"tests/test_playlist_folder_qml.py" = ["S603", "C901"]
"tests/test_folder_back_navigation.py" = ["S603", "C901"]
"tests/test_search_results_surface_steal.py" = ["S603", "C901"]
"tests/test_search_scroll_reset.py" = ["S603", "C901"]
"tests/test_search_top_result.py" = ["S603", "C901"]
"tests/test_breadcrumb_navigation.py" = ["S603", "C901"]
"tests/test_boot_handover_gate.py" = ["S603", "C901"]
"tests/test_boot_fade_landing_park.py" = ["S603", "C901"]
"tests/test_boot_shield_cursor_release.py" = ["S603", "C901"]
"tests/test_browse_card_library_state.py" = ["S603", "C901"]
"tests/test_browse_strip_fits_the_card.py" = ["S603", "C901"]
"tests/test_library_track_claim.py" = ["S603", "C901"]
"tests/test_boot_version_drain_order.py" = ["S603", "C901"]
"tests/test_boot_scroll_dressing_hidden.py" = ["S603", "C901"]
"tests/test_search_tab_artist_restore.py" = ["S603", "C901"]
"tests/test_boot_input_shield.py" = ["S603", "C901"]
"tests/test_boot_reveal_prewarm.py" = ["S603", "C901"]
"tests/test_search_paste_autosearch.py" = ["S603", "C901"]
"tests/test_queue_failed_section.py" = ["S603", "C901"]
"tests/test_queue_row_index.py" = ["S603", "C901"]
"tests/test_queue_row_quality.py" = ["S603", "C901"]
"tests/test_queue_unavailable_word.py" = ["S603", "C901"]
"tests/test_queue_drawer_resize.py" = ["S603", "C901"]
"tests/test_queue_delta_mirror.py" = ["S603", "C901"]
"tests/test_queue_failure_reason_qml.py" = ["S603", "C901"]
"tests/test_gates_sit_above_drawers.py" = ["S603", "C901"]
"tests/test_library_downloaded_state.py" = ["S603", "C901"]
"tests/test_qml_loads.py" = ["S603", "C901"]
"tests/test_presence_call_budget.py" = ["S603", "C901"]
# Imports the download engine in a clean interpreter to check its import closure
# (S603, fixed argv: sys.executable -c with a literal probe).
"tests/test_library_bridge.py" = ["S603"]
"tests/test_nav_seq_and_history_guards.py" = ["S603", "C901"]
"tests/test_folder_badge_and_crumb_labels.py" = ["S603", "C901"]
"tests/test_hover_swell_fade.py" = ["S603", "C901"]
"tests/test_browse_console_wayfinding.py" = ["S603", "C901"]
"tests/test_browse_row_window.py" = ["S603", "C901"]
"tests/test_video_grid_hover_dwell.py" = ["S603", "C901"]
"tests/test_hover_prefetch_scenario.py" = ["S603", "C901"]
"tests/test_offscreen_qt_is_usable.py" = ["S603"]
# Runs the bundle size report for real, on a root wide enough to fill the pipe
# buffer, through the shell it is written for (S603/S607, fixed argv).
"tests/test_final_audit_updater.py" = ["S603", "S607"]
# Same subprocess-isolation + linear-scenario shape as the scroll guard.
"tests/test_update_toast_staged.py" = ["S603", "C901"]
"tests/test_video_card_date_no_overlap.py" = ["S603", "C901"]
"tests/test_search_playlist_block.py" = ["S603", "C901"]
"tests/test_playlist_selection_and_reset.py" = ["S603", "C901"]
"tests/test_progress_matrix_stable_width.py" = ["S603", "C901"]
"tests/test_progress_carved_percent.py" = ["S603", "C901"]
"tests/test_queue_row_progress_density.py" = ["S603", "C901"]
"tests/test_card_progress_outline.py" = ["S603", "C901"]
"tests/test_queue_playlist_expands.py" = ["S603", "C901"]
"tests/test_queue_expected_tier.py" = ["S603", "C901"]
"tests/test_queue_in_library_row.py" = ["S603", "C901"]
"tests/test_queue_ledger_cap.py" = ["S603", "C901"]
"tests/test_queue_repeated_track_state.py" = ["S603", "C901"]
"tests/test_queue_owned_prediction.py" = ["S603", "C901"]
"tests/test_progress_jump_ramp.py" = ["S603", "C901"]
"tests/test_progress_pad_cells.py" = ["S603", "C901"]
"tests/test_search_artists_show_all_empty.py" = ["S603", "C901"]
"tests/test_boot_library_scan_deferral.py" = ["S603", "C901"]
# Drives the real release.sh (bash) and git against throwaway sandbox repos;
# both are resolved from PATH on purpose (S603/S607, fixed argv).
"tests/test_release_star_history.py" = ["S603", "S607"]
# The Waves bridge has several inherently branchy but linear functions (the
# settings-schema builder, the settings dispatcher and the search/discography
# orchestration) that trip mccabe (C901) without being genuinely complex.
"waves/waves_ui/backend.py" = ["C901"]
# The ffmpeg manager's job is to download and run a static ffmpeg build, so it
# intentionally shells out (S603/S607); install() is one linear sequence (C901);
# and its raised errors carry deliberately descriptive messages (TRY003).
"waves/waves_ui/ffmpeg_manager.py" = ["S603", "S607", "C901", "TRY003"]
# The updater downloads and swaps a packaged build, so it intentionally shells
# out (S603/S607) for the platform swap/relaunch; install()/_apply are linear
# sequences (C901); and its errors carry deliberately descriptive messages (TRY003).
"waves/waves_ui/updater.py" = ["S603", "S606", "S607", "C901", "TRY003"]
# download.py is upstream Tidaler code (kept as-is apart from the keep_album flag);
# its downsample/transcode raises carry deliberately descriptive messages (TRY003),
# same rationale as ffmpeg_manager/updater above.
"waves/download.py" = ["TRY003"]

[tool.black]
# https://github.com/psf/black
target-version = ["py312", "py313"]
line-length = 120
color = true
preview = true

exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | env
    | venv
)/
'''
